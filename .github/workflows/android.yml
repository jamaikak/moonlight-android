name: Android build

on:
  push:
    branches: [ moonlight-noir, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK, so only add what the build needs
      - name: Install NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleNonRoot_gameDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-fork-debug-apks
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk

      # Publish the phone build as a release asset so it can be downloaded straight from the phone
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/moonlight-noir'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/nonRoot_game/debug/*arm64-v8a*.apk | head -n 1)
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk "$APK" --prerelease --title "Latest APK (arm64-v8a)" \
            --notes "Debug build of ${GITHUB_SHA::7} for arm64-v8a phones such as the Pixel Fold."
