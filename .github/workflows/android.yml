name: Android build

on:
  push:
    branches: [ moonlight-noir, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleNonRoot_gameDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-fork-debug-apks
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
